name: Micro-SaaS Factory

on:
  workflow_dispatch: {}
  schedule:
    # Runs once a day at 06:00 UTC. Adjust as needed.
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tool:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai

      - name: Generate new micro-tool with Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_tool.py

      - name: Open pull request with the generated tool
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add new AI-generated micro-tool"
          branch: "factory/new-micro-tool-${{ github.run_number }}"
          delete-branch: true
          title: "New Micro-Tool Generated by Gemini"
          body: |
            This PR was opened automatically by the micro-SaaS factory workflow.

            - Generated by: `${{ github.workflow }}` (run #${{ github.run_number }})
            - Model: `gemini-3.5-flash`
            - Idea generated: `${{ steps.generate.outputs.tool_idea }}`

            Please review `app/index.html` before merging.
          add-paths: |
            app/index.html
