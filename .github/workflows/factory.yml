name: Micro-SaaS Factory

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tool:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai

      - name: Generate new tool definition with Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_tool.py

      - name: Open pull request with the updated tool registry
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add new AI tool: ${{ steps.generate.outputs.tool_title }}"
          branch: "factory/new-tool-${{ github.run_number }}"
          delete-branch: true
          title: "New Tool Generated: ${{ steps.generate.outputs.tool_title }}"
          body: |
            This PR was opened automatically by the micro-SaaS factory workflow.

            - Generated by: `${{ github.workflow }}` (run #${{ github.run_number }})
            - Model: `${{ steps.generate.outputs.model_used }}`
            - Tool: **${{ steps.generate.outputs.tool_title }}** (`${{ steps.generate.outputs.tool_id }}`)

            The tool has been added to the central registry (`config/tools.json`).  
            Please review the definition and test the tool before merging.

            **Changes:**
            - Added entry to `config/tools.json`
          add-paths: |
            config/tools.json
